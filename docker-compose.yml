# Each app reads its own apps/<app>/.env.production:
# NEXT_PUBLIC_* are baked in by `next build` (rebuild after changing them),
# the rest (e.g. GOOGLE_MAPS_API_KEY) is passed at runtime via env_file.
services:
  workspace:
    build:
      context: .
      args:
        APP: workspace
        PORT: 3000
    container_name: engli-tutor-workspace
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - apps/workspace/.env.production
    restart: unless-stopped
    networks:
      - default
      - proxy

  marketing:
    build:
      context: .
      args:
        APP: marketing
        PORT: 3002
    container_name: engli-tutor-marketing
    ports:
      - "127.0.0.1:3002:3002"
    env_file:
      - apps/marketing/.env.production
    restart: unless-stopped
    networks:
      - default
      - proxy

networks:
  proxy:
    name: nginx-proxy-manager_default
    external: true
