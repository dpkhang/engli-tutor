# NEXT_PUBLIC_* are baked in at build time — rebuild after changing them.
# Values come from fe/.env (see .env.docker.example).
x-public-urls: &public-urls
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
  NEXT_PUBLIC_MARKETING_URL: ${NEXT_PUBLIC_SITE_URL}

services:
  workspace:
    build:
      context: .
      args:
        <<: *public-urls
        APP: workspace
        PORT: 3000
    container_name: engli-tutor-workspace
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    networks:
      - default
      - proxy

  marketing:
    build:
      context: .
      args:
        <<: *public-urls
        APP: marketing
        PORT: 3002
    container_name: engli-tutor-marketing
    ports:
      - "127.0.0.1:3002:3002"
    restart: unless-stopped
    networks:
      - default
      - proxy

networks:
  proxy:
    name: nginx-proxy-manager_default
    external: true
