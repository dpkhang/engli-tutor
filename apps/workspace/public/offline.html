<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" />
    <title>EngliTutor — Offline</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #070a15; color: #e2e8f0; }
        p { color: #94a3b8; }
      }
      main { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 0; font-size: 14px; line-height: 1.5; color: #475569; }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 999px;
        padding: 10px 22px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #4f46e5;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>EngliTutor needs a connection for lessons and your AI tutor. Check your network, then try again.</p>
      <p lang="vi">Bạn đang offline. Hãy kiểm tra kết nối mạng rồi thử lại.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
